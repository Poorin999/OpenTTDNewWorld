name: Build OpenTTD 15.3 (Stock Market) for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# A newer push cancels the older build that is still running, so a series of quick commits only builds once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # windows-latest uses a newer MSVC toolchain than the legacy breakpad port supports.
    # Pin to 2022 until the dependency is updated.
    runs-on: windows-2022

    steps:
    - name: Checkout this repository (holds patch/stock-market.patch and the mod files)
      uses: actions/checkout@v4
      with:
        path: mod

    - name: Checkout OpenTTD 15.3
      uses: actions/checkout@v4
      with:
        repository: OpenTTD/OpenTTD
        ref: '15.3'
        path: openttd

    # The patch only changes files that already exist in OpenTTD 15.3.
    - name: Apply stock market patch
      shell: bash
      run: |
        cd openttd
        git apply --whitespace=nowarn ../mod/patch/stock-market.patch
        git status --short

    # The new files of the mod live in the category folders of this repository (stock/, gui/, wallet/, bank/, saveload/, widgets/, lang/).
    # Refuse to overwrite anything that OpenTTD already has, so that the two sources can never clash.
    - name: Check that no mod file clashes with OpenTTD
      shell: bash
      run: python3 mod/tools/apply_overlay.py openttd --check

    - name: Add mod files, register commands, sources and strings
      shell: bash
      run: python3 mod/tools/apply_overlay.py openttd

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6
      with:
        path: openttd

    - name: Configure developer command prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build
      shell: bash
      working-directory: openttd
      run: |
        mkdir build
        cd build
        cmake .. \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DVCPKG_TARGET_TRIPLET=x64-windows-static \
          -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.vcpkg-cmake }}"
        cmake --build .

    - name: Collect files
      shell: bash
      run: |
        mkdir -p out/lang
        cp openttd/build/openttd.exe out/
        cp -r openttd/bin/ai openttd/bin/game out/ 2>/dev/null || true
        cp openttd/build/lang/*.lng out/lang/ 2>/dev/null || true

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: OpenTTD-15.3-StockMarket-Windows
        path: out
